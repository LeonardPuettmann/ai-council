[project]
name = "ai-councel"
version = "0.1.0"
description = "A virtual board of advisors for the terminal."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "mistralai>=1.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pydantic>=2.6.0",
]

[project.scripts]
council = "harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
